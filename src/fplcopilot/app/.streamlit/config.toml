borderColor = "#2A3A44"
dataframeBorderColor = "#1E2B33"
dataframeHeaderBackgroundColor = "#131C23"
codeBackgroundColor = "#131C23"
blueColor = "#38B6FF"
greenColor = "#3FB97A"
yellowColor = "#E0B040"
orangeColor = "#F08A4B"
redColor = "#F06A6F"
