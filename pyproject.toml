[project]
name = "fplcopilot"
version = "0.1.0"
description = "FPL decision-support system: xPts + news RAG + optimizer + agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0",
    "flashrank>=0.2",
    "highspy>=1.15.1",
    "httpx>=0.27",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.1",
    "mcp[cli]>=2.2",
    "numpy>=1.26",
    "openai>=1.50",
    "pgvector>=0.3",
    "pillow>=10.1",
    "psycopg[binary]>=3.1",
    "pulp>=3.3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "tiktoken>=0.7",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplcopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the live FPL API or OpenAI",
    "db: tests that need a running Postgres (docker compose up -d db); skip if unreachable",
    "llm: tests that call OpenAI for real (always also marked network); run with -m llm",
]

[tool.ruff]
line-length = 100
target-version = "py312"
